# Local MySQL for development only. Keeps dev work and migrations away from the production DB.
#   docker compose -f docker-compose.dev.yml up -d
# The app reads DATABASE_URL from .env.development.local; Prisma CLI must go through the
# db:dev:* npm scripts (plain `npx prisma` reads .env, which points at production).
services:
  mysql-dev:
    image: mysql:8.0
    container_name: meetingroom-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: db_meetingroom
      MYSQL_USER: meetingroom
      MYSQL_PASSWORD: meetingroom
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql

volumes:
  mysql-dev-data:
